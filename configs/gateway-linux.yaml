server:
    name: com-manager-01
    log_level: debug
    log_path: ./logs
web:
    enabled: true
    port: 18080
    host: 0.0.0.0
    auth:
        enabled: true
        username: admin
        password: admin123
        token_secret: change-me-in-production
        token_expire: 24h
    cors:
        enabled: true
        allowed_origins:
            - '*'
serial_devices:
    - id: rtu-device-1
      name: RTU设备1
      port: /dev/ttyS0
      baud_rate: 9600
      data_bits: 8
      stop_bits: 1
      parity: none
      protocol: modbus_rtu
      slave_id: 1
      poll_interval: 1s
      timeout: 3s
      retry: 3
      enabled: false
    - id: rtu-device-2
      name: 串口设备2
      port: /dev/ttyS1
      baud_rate: 9600
      data_bits: 8
      stop_bits: 1
      parity: none
      protocol: modbus_rtu
      slave_id: 1
      poll_interval: 5s
      timeout: 3s
      retry: 3
      enabled: false
network_devices:
    - id: tcp-device-1
      name: TCP设备1
      host: 127.0.0.1
      port: 503
      protocol: modbus_tcp
      slave_id: 1
      poll_interval: 1s
      timeout: 3s
      retry: 3
      enabled: true
      cid_file: ""
    - id: tcp-2
      name: tcp设备2
      host: 127.0.0.1
      port: 504
      protocol: modbus_tcp
      slave_id: 1
      poll_interval: 5s
      timeout: 3s
      retry: 0
      enabled: true
      cid_file: ""
outputs:
    modbus_tcp_servers:
        - id: "1"
          name: modbustcp
          listen_port: 5020
          slave_id: 1
          max_connections: 10
    modbus_rtu_servers: []
    group_devices:
        "1":
            - rtu-device-1
            - tcp-device-1
            - rtu-device-2
            - tcp-2
        modbustcpout:
            - rtu-device-2
            - tcp-2
mappings:
