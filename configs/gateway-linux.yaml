offline_buffer:
    enabled: true
    db_path: ./data/offline.db
    retention_days: 10
    max_db_size_mb: 500
    memory_queue_size: 10000
    flush_interval: 10m
    report_strategy:
        batch_size: 100
        batch_interval: 500ms
        max_retries: 3
        priority_mode: time
        concurrent_group: 1
    group_override: {}
