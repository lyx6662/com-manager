<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>通讯管理机平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
    <div class="d-flex">
        <!-- 侧边栏 -->
        <nav class="sidebar bg-dark text-white" id="sidebar">
            <div class="sidebar-header p-3 border-bottom border-secondary">
                <h5 class="mb-0">通讯管理机</h5>
                <small class="text-muted">v1.0.0</small>
            </div>
            <ul class="nav flex-column p-2">
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" onclick="loadPage('device', this)">
                        <i class="bi bi-hdd-rack me-2"></i>设备管理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" onclick="loadPage('datapool', this)">
                        <i class="bi bi-database me-2"></i>数据池
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" onclick="loadPage('output', this)">
                        <i class="bi bi-box-arrow-right me-2"></i>输出管理
                    </a>
                </li>
                <!-- 断点续传和报警记录功能暂时禁用
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" onclick="loadPage('buffer', this)">
                        <i class="bi bi-arrow-repeat me-2"></i>断点续传
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" onclick="loadPage('alarm', this)">
                        <i class="bi bi-exclamation-triangle me-2"></i>报警记录
                    </a>
                </li>
                -->
                <li class="nav-item">
                    <a class="nav-link text-white" href="#" onclick="loadPage('system', this)">
                        <i class="bi bi-gear me-2"></i>系统设置
                    </a>
                </li>
            </ul>
        </nav>

        <!-- 主内容区 -->
        <div class="main-content flex-grow-1">
            <!-- 顶部导航 -->
            <nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
                <div class="container-fluid">
                    <button class="btn btn-outline-secondary" onclick="toggleSidebar()">
                        <i class="bi bi-list"></i>
                    </button>
                    <div class="ms-auto d-flex align-items-center">
                        <span class="me-3 text-muted" id="system-status">
                            <i class="bi bi-circle-fill text-success"></i> 运行中
                        </span>
                        <div class="dropdown">
                            <button class="btn btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown">
                                <i class="bi bi-person-circle"></i> admin
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#" onclick="loadPage('system', this)">系统设置</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" onclick="logout()">退出登录</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </nav>

            <!-- 内容区 -->
            <div class="content p-4" id="content">
                <div class="text-center text-muted py-5">
                    <i class="bi bi-arrow-left-circle" style="font-size: 3rem;"></i>
                    <p class="mt-3">请从左侧菜单选择功能</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 登录弹窗 -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">登录</h5>
                </div>
                <div class="modal-body">
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" id="username" value="admin" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码</label>
                            <input type="password" class="form-control" id="password" required>
                        </div>
                        <div class="alert alert-danger d-none" id="loginError"></div>
                        <button type="submit" class="btn btn-primary w-100">登录</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/js/app.js?v=4"></script>
</body>
</html>
