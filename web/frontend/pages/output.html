<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">
        <i class="bi bi-box-arrow-right me-2"></i>输出管理
    </h4>
    <div>
        <button class="btn btn-success me-2" onclick="oneClickConfig()">
            <i class="bi bi-magic me-1"></i>一键配置
        </button>
        <button class="btn btn-outline-primary" onclick="loadAllOutputData()">
            <i class="bi bi-arrow-clockwise me-1"></i>刷新
        </button>
    </div>
</div>

<!-- Tab 导航 -->
<ul class="nav nav-tabs mb-4" id="outputTabs">
    <li class="nav-item">
        <a class="nav-link active" href="#" onclick="switchOutputTab('modbus')">
            <i class="bi bi-ethernet me-1"></i>Modbus 输出
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="#" onclick="switchOutputTab('iec61850')">
            <i class="bi bi-globe me-1"></i>IEC 61850 输出
        </a>
    </li>
</ul>

<!-- Modbus 输出 Tab -->
<div id="tabModbus" class="output-tab">
    <div class="row">
        <!-- 左侧：输出服务器列表 -->
        <div class="col-md-3">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-list me-1"></i>输出服务器</span>
                    <button class="btn btn-sm btn-primary" onclick="showAddOutput()">
                        <i class="bi bi-plus"></i>
                    </button>
                </div>
                <div class="card-body p-0">
                    <div class="list-group list-group-flush" id="outputServerList">
                        <div class="list-group-item text-center text-muted py-3">加载中...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧：映射规则配置 -->
        <div class="col-md-9">
            <div id="modbusMappingPanel">
                <div class="card">
                    <div class="card-body text-center text-muted py-5">
                        <i class="bi bi-arrow-left-circle" style="font-size: 2rem;"></i>
                        <p class="mt-2">请从左侧选择输出服务器</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- IEC 61850 输出 Tab -->
<div id="tabIEC61850" class="output-tab" style="display:none;">
    <div class="row">
        <!-- IEC 61850 服务器状态 -->
        <div class="col-md-3">
            <div class="card">
                <div class="card-header">
                    <i class="bi bi-info-circle me-1"></i>服务器状态
                </div>
                <div class="card-body" id="iec61850StatusPanel">
                    <div class="text-center text-muted py-3">加载中...</div>
                </div>
            </div>
            <div class="card mt-3">
                <div class="card-header">
                    <i class="bi bi-gear me-1"></i>快速操作
                </div>
                <div class="card-body">
                    <button class="btn btn-success w-100 mb-2" onclick="iec61850OneClickConfig()">
                        <i class="bi bi-magic me-1"></i>一键配置 IEC 61850
                    </button>
                    <button class="btn btn-outline-primary w-100" onclick="showAddIEC61850Mapping()">
                        <i class="bi bi-plus me-1"></i>手动添加映射
                    </button>
                </div>
            </div>
        </div>

        <!-- IEC 61850 映射规则 -->
        <div class="col-md-9">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="bi bi-diagram-3 me-1"></i>映射规则 (<span id="iec61850MappingCount">0</span>)</span>
                    <div>
                        <button class="btn btn-sm btn-outline-danger me-1" onclick="clearIEC61850Mappings()">
                            <i class="bi bi-trash me-1"></i>清空
                        </button>
                        <button class="btn btn-sm btn-primary" onclick="showAddIEC61850Mapping()">
                            <i class="bi bi-plus me-1"></i>添加
                        </button>
                    </div>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                        <table class="table table-hover table-sm mb-0">
                            <thead class="table-light sticky-top">
                                <tr>
                                    <th style="width: 40px;">#</th>
                                    <th>源设备</th>
                                    <th>源数据点</th>
                                    <th>IEC 61850 路径</th>
                                    <th>目标类型</th>
                                    <th>缩放</th>
                                    <th style="width: 80px;">操作</th>
                                </tr>
                            </thead>
                            <tbody id="iec61850MappingBody">
                                <tr><td colspan="7" class="text-center text-muted py-3">加载中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 新增/编辑输出服务器弹窗 -->
<div class="modal fade" id="outputModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="outputModalTitle">新增输出</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="outputForm">
                    <div class="mb-3">
                        <label class="form-label">输出类型</label>
                        <select class="form-select" id="outputProtocol" onchange="toggleOutputFields()">
                            <option value="tcp">Modbus TCP</option>
                            <option value="rtu">Modbus RTU</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">输出ID</label>
                        <input type="text" class="form-control" id="outputId" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">输出名称</label>
                        <input type="text" class="form-control" id="outputName" required>
                    </div>
                    <div id="tcpFields">
                        <div class="mb-3">
                            <label class="form-label">监听端口</label>
                            <input type="number" class="form-control" id="tcpPort" value="502" min="1" max="65535">
                        </div>
                    </div>
                    <div id="rtuFields" style="display:none;">
                        <div class="mb-3">
                            <label class="form-label">串口号</label>
                            <select class="form-select" id="rtuPort"><option value="">加载中...</option></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">波特率</label>
                            <select class="form-select" id="rtuBaudRate">
                                <option value="9600">9600</option>
                                <option value="19200">19200</option>
                                <option value="38400">38400</option>
                                <option value="115200">115200</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">从站ID</label>
                        <input type="number" class="form-control" id="outputSlaveId" value="1" min="1" max="247">
                    </div>
                    <div class="mb-3" id="maxConnectionsField">
                        <label class="form-label">最大连接数</label>
                        <input type="number" class="form-control" id="maxConnections" value="10" min="1">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveOutput()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- Modbus 映射编辑弹窗 -->
<div class="modal fade" id="modbusMappingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modbusMappingModalTitle">编辑映射</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="modbusMappingForm">
                    <div class="mb-3">
                        <label class="form-label">源数据点</label>
                        <select class="form-select" id="mmSourcePoint" required>
                            <option value="">选择数据点...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">目标寄存器地址</label>
                        <input type="number" class="form-control" id="mmTargetRegister" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">目标类型</label>
                        <select class="form-select" id="mmTargetType">
                            <option value="holding">保持寄存器 (holding)</option>
                            <option value="coil">线圈 (coil)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">数据类型</label>
                        <select class="form-select" id="mmDataType">
                            <option value="uint16">uint16</option>
                            <option value="int16">int16</option>
                            <option value="uint32">uint32</option>
                            <option value="int32">int32</option>
                            <option value="float32">float32</option>
                            <option value="bool">bool</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">缩放系数</label>
                            <input type="number" class="form-control" id="mmScale" value="1" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">偏移量</label>
                            <input type="number" class="form-control" id="mmOffset" value="0" step="0.01">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">字节序</label>
                        <select class="form-select" id="mmByteOrder">
                            <option value="">默认 (ABCD)</option>
                            <option value="BADC">BADC (字交换)</option>
                            <option value="CDAB">CDAB (字节交换)</option>
                            <option value="DCBA">DCBA (小端)</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveModbusMapping()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- IEC 61850 映射编辑弹窗 -->
<div class="modal fade" id="iec61850MappingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="iec61850MappingModalTitle">添加 IEC 61850 映射</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="iec61850MappingForm">
                    <div class="mb-3">
                        <label class="form-label">源数据点</label>
                        <select class="form-select" id="imSourcePoint" required>
                            <option value="">选择数据点...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">IEC 61850 路径</label>
                        <input type="text" class="form-control" id="imIECPath" placeholder="如: WG/MMXU1.TotW0.mag.f" required>
                        <div class="form-text">格式: 逻辑设备/逻辑节点.数据对象.数据属性</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">目标类型</label>

                            <option value="int16">int16</option>
                            <option value="uint16">uint16</option>
                            <option value="bool">bool</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">缩放系数</label>
                            <input type="number" class="form-control" id="imScale" value="1" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">偏移量</label>
                            <input type="number" class="form-control" id="imOffset" value="0" step="0.01">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>

            </div>
        </div>
    </div>
</div>

<!-- 一键配置确认弹窗 -->
<div class="modal fade" id="oneClickModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">一键配置</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>将自动配置输出映射规则：</p>
                <ul>
                    <li><strong>Modbus 输出</strong>：按寄存器地址顺序转发所有数据点</li>
                    <li><strong>IEC 61850 输出</strong>：按设备名称自动映射到 IEC 61850 路径</li>
                </ul>
                <p class="text-warning"><i class="bi bi-exclamation-triangle me-1"></i>此操作将覆盖现有映射配置！</p>
                <div class="mb-3">
                    <label class="form-label">选择输出目标</label>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ocModbus" checked>
                        <label class="form-check-label">Modbus 输出</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="ocIEC61850" checked>
                        <label class="form-check-label">IEC 61850 输出</label>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">起始寄存器地址 (Modbus)</label>
                    <input type="number" class="form-control" id="ocStartRegister" value="0" min="0">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-success" onclick="executeOneClickConfig()">确认配置</button>
            </div>
        </div>
    </div>
</div>

<script>
var tcpOutputs = [];
var rtuOutputs = [];
var selectedOutputId = '';
var allDataPoints = [];
var iec61850Mappings = [];
var editingModbusMappingIndex = -1;

// Tab 切换
function switchOutputTab(tab) {
    document.querySelectorAll('.output-tab').forEach(function(el) { el.style.display = 'none'; });
    document.querySelectorAll('#outputTabs .nav-link').forEach(function(el) { el.classList.remove('active'); });
    document.getElementById('tab' + (tab === 'modbus' ? 'Modbus' : 'IEC61850')).style.display = 'block';
    document.querySelectorAll('#outputTabs .nav-link')[tab === 'modbus' ? 0 : 1].classList.add('active');
    if (tab === 'iec61850') loadIEC61850Data();
}

async function initOutputPage() {
    await loadAllOutputData();
}

async function loadAllOutputData() {
    await Promise.all([loadOutputs(), loadDataPoints()]);
    renderOutputServerList();
    if (selectedOutputId) {
        var found = false;
        tcpOutputs.forEach(function(o) { if (o.id === selectedOutputId) found = true; });
        rtuOutputs.forEach(function(o) { if (o.id === selectedOutputId) found = true; });
        if (found) selectOutput(selectedOutputId);
    }
}

// 加载输出配置
async function loadOutputs() {
    try {
        var result = await api('GET', '/outputs');
        if (result && result.code === 0) {
            tcpOutputs = result.data.modbus_tcp_servers || [];
            rtuOutputs = result.data.modbus_rtu_servers || [];
        }
    } catch (error) {
        console.error('加载输出配置失败:', error);
    }
}

// 加载数据池数据点
async function loadDataPoints() {
    try {
        var result = await api('GET', '/datapool');
        if (result && result.code === 0) {
            allDataPoints = result.data.points || [];
        }
    } catch (error) {
        console.error('加载数据点失败:', error);
    }
}

// 渲染输出服务器列表
function renderOutputServerList() {
    var list = document.getElementById('outputServerList');
    var allOutputs = [];
    tcpOutputs.forEach(function(o) { allOutputs.push({ type: 'tcp', data: o }); });
    rtuOutputs.forEach(function(o) { allOutputs.push({ type: 'rtu', data: o }); });

    if (allOutputs.length === 0) {
        list.innerHTML = '<div class="list-group-item text-center text-muted py-3">暂无配置</div>';
        return;
    }

    list.innerHTML = allOutputs.map(function(item) {
        var icon = item.type === 'tcp' ? 'bi-ethernet' : 'bi-usb';
        var info = item.type === 'tcp' ? '端口:' + item.data.listen_port : '串口:' + item.data.port;
        var active = selectedOutputId === item.data.id ? 'active' : '';
        return '<a href="#" class="list-group-item list-group-item-action ' + active + '" ' +
               'onclick="selectOutput(\'' + item.data.id + '\')">' +
               '<div><i class="bi ' + icon + ' me-2"></i><strong>' + item.data.name + '</strong></div>' +
               '<small class="text-muted">' + info + ' | 从站:' + item.data.slave_id + '</small></a>';
    }).join('');
}

// 选择输出服务器
async function selectOutput(outputId) {
    selectedOutputId = outputId;
    renderOutputServerList();
    await renderModbusMappingPanel(outputId);
}

// 渲染 Modbus 映射配置面板
async function renderModbusMappingPanel(outputId) {
    var panel = document.getElementById('modbusMappingPanel');
    var output = null;
    tcpOutputs.forEach(function(o) { if (o.id === outputId) output = o; });
    rtuOutputs.forEach(function(o) { if (o.id === outputId) output = o; });
    if (!output) return;

    // 获取该输出服务器关联的设备列表
    var deviceIds = await getOutputDevices(outputId);

    // 加载所有设备的映射规则
    var allMappings = [];
    for (var i = 0; i < deviceIds.length; i++) {
        try {
            var result = await api('GET', '/mappings/' + deviceIds[i]);
            if (result && result.code === 0 && result.data && result.data.rules) {
                result.data.rules.forEach(function(r) { allMappings.push(r); });
            }
        } catch (e) {}
    }

    var html = '<div class="card mb-3"><div class="card-header d-flex justify-content-between align-items-center">' +
        '<span><i class="bi bi-gear me-1"></i>' + output.name + '</span>' +
        '<div><button class="btn btn-sm btn-outline-primary me-1" onclick="editOutput(\'' + outputId + '\')"><i class="bi bi-pencil"></i> 编辑</button>' +
        '<button class="btn btn-sm btn-outline-danger" onclick="deleteOutput(\'' + outputId + '\')"><i class="bi bi-trash"></i> 删除</button></div></div>' +
        '<div class="card-body"><div class="row">' +
        '<div class="col-md-3"><small class="text-muted">ID:</small><br><code>' + output.id + '</code></div>' +
        '<div class="col-md-3"><small class="text-muted">从站ID:</small><br>' + output.slave_id + '</div>' +
        '<div class="col-md-3"><small class="text-muted">关联设备:</small><br>' + deviceIds.length + ' 个</div>' +
        '<div class="col-md-3"><small class="text-muted">映射数:</small><br>' + allMappings.length + '</div>' +
        '</div></div></div>';

    // 映射规则表
    html += '<div class="card"><div class="card-header d-flex justify-content-between align-items-center">' +
        '<span><i class="bi bi-list-ul me-1"></i>映射规则 (' + allMappings.length + ')</span>' +
        '<div><button class="btn btn-sm btn-success me-1" onclick="modbusOneClickConfig(\'' + outputId + '\')"><i class="bi bi-magic me-1"></i>一键配置</button>' +
        '<button class="btn btn-sm btn-primary" onclick="showAddModbusMapping(\'' + outputId + '\')"><i class="bi bi-plus me-1"></i>添加</button></div></div>' +
        '<div class="card-body p-0"><div class="table-responsive" style="max-height: 500px; overflow-y: auto;">' +
        '<table class="table table-hover table-sm mb-0"><thead class="table-light sticky-top"><tr>' +
        '<th style="width:40px">#</th><th>设备</th><th>数据点</th><th>源寄存器</th><th>目标寄存器</th><th>类型</th><th>缩放</th><th style="width:80px">操作</th>' +
        '</tr></thead><tbody id="modbusMappingBody">';

    if (allMappings.length === 0) {
        html += '<tr><td colspan="8" class="text-center text-muted py-3">暂无映射规则，点击"一键配置"或"添加"</td></tr>';
    } else {
        allMappings.forEach(function(m, i) {
            html += '<tr>' +
                '<td>' + (i + 1) + '</td>' +
                '<td><code>' + (m.source_device || '') + '</code></td>' +
                '<td>' + (m.name || '') + '</td>' +
                '<td>' + (m.source_type || '') + ' ' + (m.source_register || 0) + '</td>' +
                '<td>' + (m.target_register || 0) + '</td>' +
                '<td><span class="badge bg-secondary">' + (m.data_type || 'uint16') + '</span></td>' +
                '<td>' + (m.scale || 1) + '</td>' +
                '<td><button class="btn btn-sm btn-outline-danger" onclick="deleteModbusMapping(\'' + (m.source_device || '') + '\', \'' + (m.name || '') + '\')"><i class="bi bi-trash"></i></button></td>' +
                '</tr>';
        });
    }

    html += '</tbody></table></div></div></div>';
    panel.innerHTML = html;
}

// 获取输出服务器关联的设备列表
async function getOutputDevices(outputId) {
    try {
        var result = await api('GET', '/groups');
        if (result && result.code === 0) {
            var groups = result.data || [];
            for (var i = 0; i < groups.length; i++) {
                if (groups[i].id === outputId || groups[i].output_id === outputId) {
                    return groups[i].devices || [];
                }
            }
        }
    } catch (e) {}

    // 如果没有找到分组配置，返回所有设备
    var deviceIds = [];
    allDataPoints.forEach(function(p) {
        if (deviceIds.indexOf(p.device_id) < 0) deviceIds.push(p.device_id);
    });
    return deviceIds;
}

// 显示添加 Modbus 映射弹窗
function showAddModbusMapping(outputId) {
    editingModbusMappingIndex = -1;
    document.getElementById('modbusMappingModalTitle').textContent = '添加映射';
    document.getElementById('modbusMappingForm').reset();
    document.getElementById('mmScale').value = '1';
    document.getElementById('mmOffset').value = '0';
    document.getElementById('mmTargetRegister').value = '0';

    // 填充数据点下拉框
    var select = document.getElementById('mmSourcePoint');
    select.innerHTML = '<option value="">选择数据点...</option>';
    var sorted = allDataPoints.slice().sort(function(a, b) {
        if (a.device_id !== b.device_id) return a.device_id.localeCompare(b.device_id);
        return a.point_name.localeCompare(b.point_name);
    });
    sorted.forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.device_id + '.' + p.point_name + ' (当前值:' + p.value + ')';
        select.appendChild(opt);
    });

    new bootstrap.Modal(document.getElementById('modbusMappingModal')).show();
}

// 保存 Modbus 映射
async function saveModbusMapping() {
    var sourceId = document.getElementById('mmSourcePoint').value;
    if (!sourceId) {
        showToast('请选择源数据点', 'warning');
        return;
    }

    var parts = sourceId.split('.');
    var deviceId = parts[0];
    var pointName = parts.slice(1).join('.');

    var newRule = {
        name: pointName,
        source_device: deviceId,
        source_register: 0,
        source_type: 'holding',
        data_type: document.getElementById('mmDataType').value,
        register_count: 1,
        target_register: parseInt(document.getElementById('mmTargetRegister').value),
        scale: parseFloat(document.getElementById('mmScale').value) || 1,
        offset: parseFloat(document.getElementById('mmOffset').value) || 0,
        unit: ''
    };

    // 获取该设备的当前映射
    try {
        var result = await api('GET', '/mappings/' + deviceId);
        var rules = (result && result.code === 0 && result.data && result.data.rules) ? result.data.rules : [];

        if (editingModbusMappingIndex >= 0) {
            rules[editingModbusMappingIndex] = newRule;
        } else {
            rules.push(newRule);
        }

        var saveResult = await api('PUT', '/mappings/' + deviceId, { rules: rules });
        if (saveResult && saveResult.code === 0) {
            showToast('映射保存成功');
            bootstrap.Modal.getInstance(document.getElementById('modbusMappingModal'))?.hide();
            if (selectedOutputId) await renderModbusMappingPanel(selectedOutputId);
        } else {
            showToast(saveResult.message || '保存失败', 'danger');
        }
    } catch (error) {
        showToast('网络错误', 'danger');
    }
}

// 删除 Modbus 映射
async function deleteModbusMapping(deviceId, pointName) {
    if (!await confirmAction('确定删除该映射规则？')) return;
    try {
        var result = await api('GET', '/mappings/' + deviceId);
        if (result && result.code === 0 && result.data && result.data.rules) {
            var rules = result.data.rules.filter(function(r) { return r.name !== pointName; });
            await api('PUT', '/mappings/' + deviceId, { rules: rules });
            showToast('映射已删除');
            if (selectedOutputId) await renderModbusMappingPanel(selectedOutputId);
        }
    } catch (error) {
        showToast('删除失败', 'danger');
    }
}

// Modbus 一键配置（单个输出服务器）
async function modbusOneClickConfig(outputId) {
    if (!await confirmAction('将按寄存器顺序自动配置所有数据点的映射，是否继续？')) return;

    // 获取关联设备
    var deviceIds = await getOutputDevices(outputId);
    if (deviceIds.length === 0) {
        // 使用所有设备
        allDataPoints.forEach(function(p) {
            if (deviceIds.indexOf(p.device_id) < 0) deviceIds.push(p.device_id);
        });
    }

    var startReg = 0;
    var totalMappings = 0;

    // 为每个设备创建映射规则
    for (var d = 0; d < deviceIds.length; d++) {
        var deviceId = deviceIds[d];
        var devicePoints = allDataPoints.filter(function(p) { return p.device_id === deviceId; });
        devicePoints.sort(function(a, b) { return a.point_name.localeCompare(b.point_name); });

        var rules = [];
        devicePoints.forEach(function(p, i) {
            rules.push({
                name: p.point_name,
                source_device: p.device_id,
                source_register: 0,
                source_type: 'holding',
                data_type: p.data_type || 'uint16',
                register_count: 1,
                target_register: startReg + i,
                scale: 1,
                offset: 0,
                unit: ''
            });
        });

        try {
            await api('PUT', '/mappings/' + deviceId, { rules: rules });
            totalMappings += rules.length;
            startReg += rules.length;
        } catch (e) {
            console.error('配置设备 ' + deviceId + ' 映射失败:', e);
        }
    }

    showToast('一键配置完成，共 ' + totalMappings + ' 个映射');
    await renderModbusMappingPanel(outputId);
}

// IEC 61850 一键配置
async function iec61850OneClickConfig() {
    // 按设备分组
    var deviceGroups = {};
    allDataPoints.forEach(function(p) {
        if (!deviceGroups[p.device_id]) deviceGroups[p.device_id] = [];
        deviceGroups[p.device_id].push(p);
    });

    var mappings = [];
    var deviceIndex = 1;

    Object.keys(deviceGroups).sort().forEach(function(deviceId) {
        var points = deviceGroups[deviceId].sort(function(a, b) {
            return a.point_name.localeCompare(b.point_name);
        });

        // 生成设备名称（如 MMXU1, MMXU2, ...）
        var mmxuName = 'MMXU' + deviceIndex;

        points.forEach(function(p, pointIndex) {
            mappings.push({
                source_device: p.device_id,
                source_name: p.point_name,
                iec61850_path: 'WG/' + mmxuName + '.TotW' + pointIndex + '.mag.f',
                target_type: 'float32',
                scale: 1,
                offset: 0
            });
        });

        deviceIndex++;
    });

    try {
        // 先清空现有映射
        await api('PUT', '/iec61850/mappings', []);

        // 逐个添加
        for (var i = 0; i < mappings.length; i++) {
            await api('POST', '/iec61850/mappings', mappings[i]);
        }

        showToast('IEC 61850 一键配置完成，共 ' + mappings.length + ' 个映射');
        await loadIEC61850Data();
    } catch (error) {
        showToast('IEC 61850 配置失败', 'danger');
    }
}

// 加载 IEC 61850 数据
async function loadIEC61850Data() {
    try {
        var statusResult = await api('GET', '/iec61850/status');
        if (statusResult && statusResult.code === 0) {
            var status = statusResult.data;
            var isRunning = status.enabled || status.running;
            document.getElementById('iec61850StatusPanel').innerHTML =
                '<table class="table table-sm mb-0">' +
                '<tr><td class="text-muted">状态</td><td>' + (isRunning ? '<span class="badge bg-success">运行中</span>' : '<span class="badge bg-secondary">已停止</span>') + '</td></tr>' +
                '<tr><td class="text-muted">端口</td><td>' + (status.port || '-') + '</td></tr>' +
                '<tr><td class="text-muted">IED</td><td>' + (status.ied_name || '-') + '</td></tr>' +
                '<tr><td class="text-muted">映射数</td><td>' + (status.mapping_count || 0) + '</td></tr>' +
                '<tr><td class="text-muted">连接数</td><td>' + (status.active_connections || 0) + '/' + (status.max_connections || 10) + '</td></tr>' +
                '</table>';
        }

        var mappingsResult = await api('GET', '/iec61850/mappings');
        if (mappingsResult && mappingsResult.code === 0) {
            iec61850Mappings = mappingsResult.data || [];
            renderIEC61850Mappings();
        }
    } catch (error) {
        console.error('加载 IEC 61850 数据失败:', error);
    }
}

// 渲染 IEC 61850 映射规则
function renderIEC61850Mappings() {
    document.getElementById('iec61850MappingCount').textContent = iec61850Mappings.length;
    var tbody = document.getElementById('iec61850MappingBody');
    if (iec61850Mappings.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-3">暂无映射规则，点击"一键配置"或"添加"</td></tr>';
        return;
    }

    tbody.innerHTML = iec61850Mappings.map(function(m, i) {
        return '<tr>' +
            '<td>' + (i + 1) + '</td>' +
            '<td><code>' + (m.source_device || '') + '</code></td>' +
            '<td>' + (m.source_name || '') + '</td>' +
            '<td><code>' + (m.iec61850_path || '') + '</code></td>' +
            '<td><span class="badge bg-info">' + (m.target_type || 'float32') + '</span></td>' +
            '<td>' + (m.scale || 1) + '</td>' +
            '<td><button class="btn btn-sm btn-outline-danger" onclick="deleteIEC61850Mapping(' + i + ')"><i class="bi bi-trash"></i></button></td>' +
            '</tr>';
    }).join('');
}

// 输出服务器 CRUD
async function showAddOutput() {
    document.getElementById('outputModalTitle').textContent = '新增输出';
    document.getElementById('outputForm').reset();
    document.getElementById('outputId').disabled = false;
    document.getElementById('outputProtocol').value = 'tcp';
    document.getElementById('outputProtocol').disabled = false;
    document.getElementById('tcpPort').value = 502;
    document.getElementById('outputSlaveId').value = 1;
    document.getElementById('maxConnections').value = 10;
    await loadSerialPortsForOutput();
    toggleOutputFields();
    new bootstrap.Modal(document.getElementById('outputModal')).show();
}

async function editOutput(outputId) {
    var output = null;
    tcpOutputs.forEach(function(o) { if (o.id === outputId) output = o; });
    rtuOutputs.forEach(function(o) { if (o.id === outputId) output = o; });
    if (!output) return;

    var type = tcpOutputs.indexOf(output) >= 0 ? 'tcp' : 'rtu';
    document.getElementById('outputModalTitle').textContent = '编辑输出';
    document.getElementById('outputId').value = output.id;
    document.getElementById('outputId').disabled = true;
    document.getElementById('outputName').value = output.name;
    document.getElementById('outputProtocol').value = type;
    document.getElementById('outputProtocol').disabled = true;
    document.getElementById('outputSlaveId').value = output.slave_id;

    if (type === 'tcp') {
        document.getElementById('tcpPort').value = output.listen_port || 502;
        document.getElementById('maxConnections').value = output.max_connections || 10;
    } else {
        await loadSerialPortsForOutput();
        document.getElementById('rtuPort').value = output.port || '';
        document.getElementById('rtuBaudRate').value = output.baud_rate || 9600;
    }

    toggleOutputFields();
    new bootstrap.Modal(document.getElementById('outputModal')).show();
}

async function deleteOutput(outputId) {
    if (!await confirmAction('确定删除该输出配置？')) return;
    tcpOutputs = tcpOutputs.filter(function(o) { return o.id !== outputId; });
    rtuOutputs = rtuOutputs.filter(function(o) { return o.id !== outputId; });
    selectedOutputId = '';
    await saveOutputsToServer();
}

async function saveOutput() {
    var type = document.getElementById('outputProtocol').value;
    var output = {
        id: document.getElementById('outputId').value,
        name: document.getElementById('outputName').value,
        slave_id: parseInt(document.getElementById('outputSlaveId').value)
    };

    if (!output.id || !output.name) {
        showToast('请填写ID和名称', 'warning');
        return;
    }

    if (type === 'tcp') {
        output.listen_port = parseInt(document.getElementById('tcpPort').value);
        output.max_connections = parseInt(document.getElementById('maxConnections').value);
        if (!document.getElementById('outputId').disabled) {
            if (tcpOutputs.some(function(o) { return o.id === output.id; }) || rtuOutputs.some(function(o) { return o.id === output.id; })) {
                showToast('输出ID已存在', 'warning');
                return;
            }
            tcpOutputs.push(output);
        } else {
            tcpOutputs = tcpOutputs.map(function(o) { return o.id === output.id ? output : o; });
        }
    } else {
        output.port = document.getElementById('rtuPort').value;
        output.baud_rate = parseInt(document.getElementById('rtuBaudRate').value);
        if (!output.port) { showToast('请选择串口', 'warning'); return; }
        if (!document.getElementById('outputId').disabled) {
            if (tcpOutputs.some(function(o) { return o.id === output.id; }) || rtuOutputs.some(function(o) { return o.id === output.id; })) {
                showToast('输出ID已存在', 'warning');
                return;
            }
            rtuOutputs.push(output);
        } else {
            rtuOutputs = rtuOutputs.map(function(o) { return o.id === output.id ? output : o; });
        }
    }

    await saveOutputsToServer();
}

async function saveOutputsToServer() {
    try {
        var result = await api('PUT', '/outputs', { modbus_tcp_servers: tcpOutputs, modbus_rtu_servers: rtuOutputs });
        if (result && result.code === 0) {
            showToast('保存成功');
            bootstrap.Modal.getInstance(document.getElementById('outputModal'))?.hide();
            await loadOutputs();
            renderOutputServerList();
            if (selectedOutputId) await renderModbusMappingPanel(selectedOutputId);
        } else {
            showToast(result.message || '保存失败', 'danger');
        }
    } catch (error) {
        showToast('网络错误', 'danger');
    }
}

function toggleOutputFields() {
    var type = document.getElementById('outputProtocol').value;
    document.getElementById('tcpFields').style.display = type === 'tcp' ? 'block' : 'none';
    document.getElementById('rtuFields').style.display = type === 'rtu' ? 'block' : 'none';
    document.getElementById('maxConnectionsField').style.display = type === 'tcp' ? 'block' : 'none';
}

async function loadSerialPortsForOutput() {
    try {
        var result = await api('GET', '/system/serial-ports');
        if (result && result.code === 0) {
            var select = document.getElementById('rtuPort');
            select.innerHTML = '';
            (result.data || []).forEach(function(port) {
                var opt = document.createElement('option');
                opt.value = port.name;
                opt.textContent = port.name + (port.used ? ' (' + port.used_by + ' 已占用)' : '');
                if (port.used) opt.disabled = true;
                select.appendChild(opt);
            });
        }
    } catch (e) {}
}
