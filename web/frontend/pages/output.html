<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">
        <i class="bi bi-box-arrow-right me-2"></i>输出管理
    </h4>
    <button class="btn btn-outline-primary" onclick="loadAllOutputData()">
        <i class="bi bi-arrow-clockwise me-1"></i>刷新
    </button>
</div>

<!-- Tab 导航 -->
<ul class="nav nav-tabs mb-4" id="outputTabs">
    <li class="nav-item">
        <a class="nav-link active" href="#" onclick="switchOutputTab('modbus')">
            <i class="bi bi-ethernet me-1"></i>Modbus 输出
        </a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="#" onclick="switchOutputTab('iec61850')">
            <i class="bi bi-globe me-1"></i>IEC 61850 输出
        </a>
    </li>
</ul>

<!-- Modbus 输出 Tab -->
<div id="tabModbus" class="output-tab">
    <!-- Modbus 输出总开关 -->
    <div class="card mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0"><i class="bi bi-ethernet me-2"></i>Modbus 输出服务</h5>
                <small class="text-muted">启用后将对外提供 Modbus TCP/RTU 数据输出</small>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="modbusEnabledSwitch" onchange="toggleModbusEnabled()" style="width: 3em; height: 1.5em;">
                <label class="form-check-label ms-2" for="modbusEnabledSwitch" id="modbusEnabledLabel">已禁用</label>
            </div>
        </div>
    </div>
    <div id="modbusOutputContainer">
        <div class="text-center text-muted py-3">加载中...</div>
    </div>
    <div class="mt-3">
        <button class="btn btn-primary" onclick="showAddOutput()">
            <i class="bi bi-plus-lg me-1"></i>新增 Modbus 输出服务器
        </button>
    </div>
</div>

<!-- IEC 61850 输出 Tab -->
<div id="tabIEC61850" class="output-tab" style="display:none;">
    <!-- IEC 61850 输出总开关 -->
    <div class="card mb-3">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h5 class="mb-0"><i class="bi bi-globe me-2"></i>IEC 61850 输出服务</h5>
                <small class="text-muted">启用后将对外提供 IEC 61850 MMS 数据输出</small>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="iec61850EnabledSwitch" onchange="toggleIEC61850Enabled()" style="width: 3em; height: 1.5em;">
                <label class="form-check-label ms-2" for="iec61850EnabledSwitch" id="iec61850EnabledLabel">已禁用</label>
            </div>
        </div>
    </div>
    <div id="iec61850OutputContainer">
        <div class="text-center text-muted py-3">加载中...</div>
    </div>
</div>

<!-- 新增/编辑输出服务器弹窗 -->
<div class="modal fade" id="outputModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="outputModalTitle">新增输出</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="outputForm">
                    <div class="mb-3">
                        <label class="form-label">输出类型</label>
                        <select class="form-select" id="outputProtocol" onchange="toggleOutputFields()">
                            <option value="tcp">Modbus TCP</option>
                            <option value="rtu">Modbus RTU</option>
                        </select>
                    </div>
                    <div class="mb-3" id="outputIdGroup">
                        <label class="form-label">输出ID</label>
                        <input type="text" class="form-control" id="outputId" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">输出名称</label>
                        <input type="text" class="form-control" id="outputName" required>
                    </div>
                    <div id="tcpFields">
                        <div class="mb-3">
                            <label class="form-label">监听端口</label>
                            <input type="number" class="form-control" id="tcpPort" value="502" min="1" max="65535">
                        </div>
                    </div>
                    <div id="rtuFields" style="display:none;">
                        <div class="mb-3">
                            <label class="form-label">串口号</label>
                            <select class="form-select" id="rtuPort"><option value="">加载中...</option></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">波特率</label>
                            <select class="form-select" id="rtuBaudRate">
                                <option value="9600">9600</option>
                                <option value="19200">19200</option>
                                <option value="38400">38400</option>
                                <option value="115200">115200</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">从站ID</label>
                        <input type="number" class="form-control" id="outputSlaveId" value="1" min="1" max="247">
                    </div>
                    <div class="mb-3" id="maxConnectionsField">
                        <label class="form-label">最大连接数</label>
                        <input type="number" class="form-control" id="maxConnections" value="10" min="1">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveOutput()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- Modbus 映射编辑弹窗 -->
<div class="modal fade" id="modbusMappingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modbusMappingModalTitle">编辑映射</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="modbusMappingForm">
                    <div class="mb-3">
                        <label class="form-label">源数据点</label>
                        <select class="form-select" id="mmSourcePoint" required>
                            <option value="">选择数据点...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">目标寄存器地址</label>
                        <input type="number" class="form-control" id="mmTargetRegister" min="0" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">目标类型</label>
                        <select class="form-select" id="mmTargetType">
                            <option value="holding">保持寄存器 (holding)</option>
                            <option value="coil">线圈 (coil)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">数据类型</label>
                        <select class="form-select" id="mmDataType">
                            <option value="uint16">uint16</option>
                            <option value="int16">int16</option>
                            <option value="uint32">uint32</option>
                            <option value="int32">int32</option>
                            <option value="float32">float32</option>
                            <option value="bool">bool</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">缩放系数</label>
                            <input type="number" class="form-control" id="mmScale" value="1" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">偏移量</label>
                            <input type="number" class="form-control" id="mmOffset" value="0" step="0.01">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">字节序</label>
                        <select class="form-select" id="mmByteOrder">
                            <option value="">默认 (ABCD)</option>
                            <option value="BADC">BADC (字交换)</option>
                            <option value="CDAB">CDAB (字节交换)</option>
                            <option value="DCBA">DCBA (小端)</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveModbusMapping()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- IEC 61850 映射编辑弹窗 -->
<div class="modal fade" id="iec61850MappingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="iec61850MappingModalTitle">添加 IEC 61850 映射</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="iec61850MappingForm">
                    <div class="mb-3">
                        <label class="form-label">源数据点</label>
                        <select class="form-select" id="imSourcePoint" required>
                            <option value="">选择数据点...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">IEC 61850 路径</label>
                        <input type="text" class="form-control" id="imIECPath" placeholder="如: WG/MMXU1.TotW0.mag.f" required>
                        <div class="form-text">格式: 逻辑设备/逻辑节点.数据对象.数据属性</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">目标类型</label>
                        <select class="form-select" id="imTargetType">
                            <option value="float32">float32</option>
                            <option value="int32">int32</option>
                            <option value="int16">int16</option>
                            <option value="uint16">uint16</option>
                            <option value="bool">bool</option>
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">缩放系数</label>
                            <input type="number" class="form-control" id="imScale" value="1" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">偏移量</label>
                            <input type="number" class="form-control" id="imOffset" value="0" step="0.01">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveIEC61850Mapping()">保存</button>
            </div>
        </div>
    </div>
</div>

<!-- IEC 61850 服务器配置弹窗 -->
<div class="modal fade" id="iec61850ConfigModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">IEC 61850 服务器配置</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="iec61850ConfigForm">
                    <div class="mb-3">
                        <label class="form-label">监听端口</label>
                        <input type="number" class="form-control" id="iec61850Port" value="102" min="1" max="65535">
                        <div class="form-text">IEC 61850 MMS 默认端口为 102</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">IED 名称</label>
                        <input type="text" class="form-control" id="iec61850IEDName" placeholder="如: GW">
                        <div class="form-text">智能电子设备名称</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">最大连接数</label>
                        <input type="number" class="form-control" id="iec61850MaxConn" value="10" min="1">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveIEC61850Config()">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
var tcpOutputs = [];
var rtuOutputs = [];
var selectedOutputId = '';
var allDataPoints = [];
var iec61850Mappings = [];
var editingModbusMappingIndex = -1;
var modbusEnabled = false;
var iec61850Enabled = false;

// Tab 切换
function switchOutputTab(tab) {
    document.querySelectorAll('.output-tab').forEach(function(el) { el.style.display = 'none'; });
    document.querySelectorAll('#outputTabs .nav-link').forEach(function(el) { el.classList.remove('active'); });
    document.getElementById('tab' + (tab === 'modbus' ? 'Modbus' : 'IEC61850')).style.display = 'block';
    document.querySelectorAll('#outputTabs .nav-link')[tab === 'modbus' ? 0 : 1].classList.add('active');
    if (tab === 'iec61850') loadIEC61850Data();
}

async function initOutputPage() {
    await loadAllOutputData();
}

async function loadAllOutputData() {
    await Promise.all([loadOutputs(), loadDataPoints(), loadModbusEnabledStatus(), loadIEC61850EnabledStatus()]);
    renderModbusOutputs();
    // 自动加载所有输出的映射规则
    var allOutputs = [];
    tcpOutputs.forEach(function(o) { allOutputs.push(o.id); });
    rtuOutputs.forEach(function(o) { allOutputs.push(o.id); });
    for (var i = 0; i < allOutputs.length; i++) {
        await renderModbusMappingPanel(allOutputs[i]);
    }
}

// 加载Modbus输出启用状态
async function loadModbusEnabledStatus() {
    try {
        var result = await api('GET', '/outputs');
        if (result && result.code === 0) {
            modbusEnabled = result.data.enabled || false;
            updateModbusEnabledUI();
        }
    } catch (error) {
        console.error('加载Modbus输出状态失败:', error);
    }
}

// 更新Modbus启用状态UI
function updateModbusEnabledUI() {
    var switchEl = document.getElementById('modbusEnabledSwitch');
    var labelEl = document.getElementById('modbusEnabledLabel');
    if (switchEl) {
        switchEl.checked = modbusEnabled;
        labelEl.textContent = modbusEnabled ? '已启用' : '已禁用';
        labelEl.className = 'form-check-label ms-2 ' + (modbusEnabled ? 'text-success' : 'text-secondary');
    }
}

// 切换Modbus输出启用状态
async function toggleModbusEnabled() {
    var switchEl = document.getElementById('modbusEnabledSwitch');
    var newState = switchEl.checked;
    try {
        var result = await api('POST', '/outputs/toggle', { enabled: newState });
        if (result && result.code === 0) {
            modbusEnabled = newState;
            updateModbusEnabledUI();
            showToast('Modbus 输出已' + (newState ? '启用' : '禁用'));
        } else {
            switchEl.checked = !newState;
            showToast(result.message || '操作失败', 'danger');
        }
    } catch (error) {
        switchEl.checked = !newState;
        showToast('网络错误', 'danger');
    }
}

// 加载IEC 61850启用状态
async function loadIEC61850EnabledStatus() {
    try {
        var result = await api('GET', '/iec61850/config');
        if (result && result.code === 0 && result.data && result.data.iec61850) {
            iec61850Enabled = result.data.iec61850.enabled || false;
            updateIEC61850EnabledUI();
        }
    } catch (error) {
        console.error('加载IEC 61850状态失败:', error);
    }
}

// 更新IEC 61850启用状态UI
function updateIEC61850EnabledUI() {
    var switchEl = document.getElementById('iec61850EnabledSwitch');
    var labelEl = document.getElementById('iec61850EnabledLabel');
    if (switchEl) {
        switchEl.checked = iec61850Enabled;
        labelEl.textContent = iec61850Enabled ? '已启用' : '已禁用';
        labelEl.className = 'form-check-label ms-2 ' + (iec61850Enabled ? 'text-success' : 'text-secondary');
    }
}

// 切换IEC 61850启用状态
async function toggleIEC61850Enabled() {
    var switchEl = document.getElementById('iec61850EnabledSwitch');
    var newState = switchEl.checked;
    try {
        var result = await api('PUT', '/iec61850/config', { enabled: newState });
        if (result && result.code === 0) {
            iec61850Enabled = newState;
            updateIEC61850EnabledUI();
            showToast('IEC 61850 输出已' + (newState ? '启用' : '禁用'));
        } else {
            switchEl.checked = !newState;
            showToast(result.message || '操作失败', 'danger');
        }
    } catch (error) {
        switchEl.checked = !newState;
        showToast('网络错误', 'danger');
    }
}

// 加载输出配置
async function loadOutputs() {
    try {
        var result = await api('GET', '/outputs');
        if (result && result.code === 0) {
            tcpOutputs = result.data.modbus_tcp_servers || [];
            rtuOutputs = result.data.modbus_rtu_servers || [];
        }
    } catch (error) {
        console.error('加载输出配置失败:', error);
    }
}

// 加载数据池数据点
async function loadDataPoints() {
    try {
        var result = await api('GET', '/datapool');
        if (result && result.code === 0) {
            allDataPoints = result.data.points || [];
        }
    } catch (error) {
        console.error('加载数据点失败:', error);
    }
}

// 渲染 Modbus 输出卡片列表
function renderModbusOutputs() {
    var container = document.getElementById('modbusOutputContainer');
    var allOutputs = [];
    tcpOutputs.forEach(function(o) { allOutputs.push({ type: 'tcp', data: o }); });
    rtuOutputs.forEach(function(o) { allOutputs.push({ type: 'rtu', data: o }); });

    if (allOutputs.length === 0) {
        container.innerHTML = '<div class="text-center text-muted py-5"><i class="bi bi-ethernet" style="font-size:2rem;"></i><p class="mt-2">暂无 Modbus 输出服务器</p></div>';
        return;
    }

    container.innerHTML = allOutputs.map(function(item) {
        var o = item.data;
        var icon = item.type === 'tcp' ? 'bi-ethernet' : 'bi-usb';
        var info = item.type === 'tcp' ? '端口:' + (o.listen_port || '-') : '串口:' + (o.port || '-');
        return '<div class="card mb-3">' +
            '<div class="card-header d-flex justify-content-between align-items-center">' +
                '<span><i class="bi ' + icon + ' me-2"></i><strong>' + o.name + '</strong> <small class="text-muted ms-2">' + info + ' | 从站:' + o.slave_id + '</small></span>' +
                '<div>' +
                    '<button class="btn btn-sm btn-outline-primary me-1" onclick="editOutput(\'' + o.id + '\')"><i class="bi bi-pencil"></i> 编辑</button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="deleteOutput(\'' + o.id + '\')"><i class="bi bi-trash"></i> 删除</button>' +
                '</div>' +
            '</div>' +
            '<div class="card-body p-0" id="modbus-panel-' + o.id + '">' +
                '<div class="text-center text-muted py-3"><i class="bi bi-arrow-repeat spin me-1"></i>加载中...</div>' +
            '</div>' +
        '</div>';
    }).join('');
}

// 选择输出服务器
async function selectOutput(outputId) {
    selectedOutputId = outputId;
    await renderModbusMappingPanel(outputId);
}

// 渲染 Modbus 映射配置面板
async function renderModbusMappingPanel(outputId) {
    var panel = document.getElementById('modbus-panel-' + outputId);
    if (!panel) return;

    var output = null;
    tcpOutputs.forEach(function(o) { if (o.id === outputId) output = o; });
    rtuOutputs.forEach(function(o) { if (o.id === outputId) output = o; });
    if (!output) return;

    var deviceIds = await getOutputDevices(outputId);

    var allMappings = [];
    for (var i = 0; i < deviceIds.length; i++) {
        try {
            var result = await api('GET', '/output-mappings/' + deviceIds[i]);
            if (result && result.code === 0 && result.data && result.data.mappings) {
                result.data.mappings.forEach(function(r) {
                    r.source_device = deviceIds[i];
                    allMappings.push(r);
                });
            }
        } catch (e) {}
    }

    var html = '<div class="p-3">' +
        '<div class="d-flex justify-content-between align-items-center mb-2">' +
            '<span><i class="bi bi-list-ul me-1"></i>映射规则 (' + allMappings.length + ')</span>' +
            '<div>' +
                '<button class="btn btn-sm btn-success me-1" onclick="modbusOneClickConfig(\'' + outputId + '\')"><i class="bi bi-magic me-1"></i>一键配置</button>' +
                '<button class="btn btn-sm btn-primary" onclick="showAddModbusMapping(\'' + outputId + '\')"><i class="bi bi-plus me-1"></i>添加</button>' +
            '</div>' +
        '</div>' +
        '<div class="table-responsive" style="max-height: 400px; overflow-y: auto;">' +
        '<table class="table table-hover table-sm mb-0"><thead class="table-light sticky-top"><tr>' +
        '<th style="width:40px">#</th><th>设备</th><th>数据点</th><th>源寄存器</th><th>目标寄存器</th><th>类型</th><th>缩放</th><th style="width:80px">操作</th>' +
        '</tr></thead><tbody id="modbusMappingBody-' + outputId + '">';

    if (allMappings.length === 0) {
        html += '<tr><td colspan="8" class="text-center text-muted py-3">暂无映射规则，点击"一键配置"或"添加"</td></tr>';
    } else {
        allMappings.forEach(function(m, i) {
            html += '<tr>' +
                '<td>' + (i + 1) + '</td>' +
                '<td><code>' + (m.source_device || '') + '</code></td>' +
                '<td>' + (m.name || '') + '</td>' +
                '<td>' + (m.source_type || '') + ' ' + (m.source_register || 0) + '</td>' +
                '<td>' + (m.target_register || 0) + '</td>' +
                '<td><span class="badge bg-secondary">' + (m.data_type || 'uint16') + '</span></td>' +
                '<td>' + (m.scale || 1) + '</td>' +
                '<td>' +
                    '<button class="btn btn-sm btn-outline-primary me-1" onclick="editModbusMapping(\'' + (m.source_device || '') + '\', \'' + (m.name || '') + '\', ' + i + ', \'' + outputId + '\')"><i class="bi bi-pencil"></i></button>' +
                    '<button class="btn btn-sm btn-outline-danger" onclick="deleteModbusMapping(\'' + (m.source_device || '') + '\', \'' + (m.name || '') + '\', \'' + outputId + '\')"><i class="bi bi-trash"></i></button>' +
                '</td>' +
                '</tr>';
        });
    }

    html += '</tbody></table></div></div>';
    panel.innerHTML = html;
}

// 获取输出服务器关联的设备列表
async function getOutputDevices(outputId) {
    // 先从 groups 配置中查找
    try {
        var result = await api('GET', '/groups');
        if (result && result.code === 0) {
            var groups = result.data || [];
            for (var i = 0; i < groups.length; i++) {
                if ((groups[i].id === outputId || groups[i].output_id === outputId) && groups[i].devices && groups[i].devices.length > 0) {
                    return groups[i].devices;
                }
            }
        }
    } catch (e) {}

    // 从设备列表 API 获取所有设备
    try {
        var devResult = await api('GET', '/devices');
        if (devResult && devResult.code === 0 && devResult.data) {

async function modbusOneClickConfig(outputId) {
    if (!await confirmAction('将按寄存器顺序自动配置所有数据点的映射，是否继续？')) return;

    var deviceIds = await getOutputDevices(outputId);
    if (deviceIds.length === 0) {
        allDataPoints.forEach(function(p) {
            if (deviceIds.indexOf(p.device_id) < 0) deviceIds.push(p.device_id);
        });
    }

    // 读取每个设备的采集配置
    var startReg = 0;
    var totalMappings = 0;

    for (var d = 0; d < deviceIds.length; d++) {
        var deviceId = deviceIds[d];
        // 先获取设备的采集点表
        var dataPoints = [];
        try {
            var result = await api('GET', '/datapoints/' + deviceId);
            if (result && result.code === 0 && result.data && result.data.points) {
                dataPoints = result.data.points;
            }
        } catch (e) {}

        var mappings = [];
        if (dataPoints.length > 0) {
            // 使用设备的采集点表，按顺序映射
            dataPoints.forEach(function(p, i) {
                mappings.push({
                    name: p.name,
                    target_register: startReg + i,
                    scale: 1,
                    offset: 0,
                    unit: ''
                });
            });
        } else {
            // 如果没有采集配置，使用数据池
            var devicePoints = allDataPoints.filter(function(p) { return p.device_id === deviceId; });
            devicePoints.sort(function(a, b) { return a.point_name.localeCompare(b.point_name); });
            devicePoints.forEach(function(p, i) {
                mappings.push({
                    name: p.point_name,
                    target_register: startReg + i,
                    scale: 1,
                    offset: 0,
                    unit: ''
                });
            });
        }

        try {
            await api('PUT', '/output-mappings/' + deviceId, mappings);
            totalMappings += mappings.length;
            startReg += mappings.length;
        } catch (e) {
            console.error('配置设备 ' + deviceId + ' 输出映射失败:', e);

    showToast('一键配置完成，共 ' + totalMappings + ' 个映射');

}

// IEC 61850 一键配置
async function iec61850OneClickConfig() {
    if (!await confirmAction('将自动配置 IEC 61850 映射，是否继续？')) return;

    // 从设备列表接口获取所有设备
    var deviceIds = [];
    try {
        var devicesResult = await api('GET', '/devices');
        if (devicesResult && devicesResult.code === 0 && devicesResult.data) {
            devicesResult.data.forEach(function(d) {
                deviceIds.push(d.id);
            });
        }
    } catch (e) {}
    deviceIds.sort();

    // 获取当前 IEC 61850 模型配置
    var modelConfig = null;
    try {
        var configResult = await api('GET', '/iec61850/config');
        if (configResult && configResult.code === 0 && configResult.data) {
            modelConfig = configResult.data.model;
        }
    } catch (e) {}

    // 获取现有的逻辑节点
    var existingNodes = [];
    if (modelConfig && modelConfig.logical_devices) {
        modelConfig.logical_devices.forEach(function(ld) {
            if (ld.logical_nodes) {
                ld.logical_nodes.forEach(function(ln) {
                    existingNodes.push(ln.name);
                });
            }
        });
    }

    var mappings = [];
    var deviceIndex = 1;

    for (var d = 0; d < deviceIds.length; d++) {
        var deviceId = deviceIds[d];
        var mmxuName = 'MMXU' + deviceIndex;

        // 先获取设备的采集点表，确定需要多少个数据对象
        var dataPoints = [];
        try {
            var result = await api('GET', '/datapoints/' + deviceId);
            if (result && result.code === 0 && result.data && result.data.points) {
                dataPoints = result.data.points;
            }
        } catch (e) {}

        var pointCount = dataPoints.length;
        if (pointCount === 0) {
            var devicePoints = allDataPoints.filter(function(p) { return p.device_id === deviceId; });
            pointCount = devicePoints.length;
        }

        // 检查并创建缺失的逻辑节点
        if (existingNodes.indexOf(mmxuName) < 0) {
            try {
                var nodeResult = await api('POST', '/iec61850/model/devices/WG/nodes', {
                    name: mmxuName,
                    data_objects: generateDefaultDataObjects(pointCount)
                });
                if (nodeResult && nodeResult.code === 0) {
                    console.log('自动创建逻辑节点: ' + mmxuName + '，包含 ' + pointCount + ' 个数据对象');
                }
            } catch (e) {
                console.error('创建逻辑节点失败: ' + mmxuName, e);
            }
        }

        // 生成映射规则
        if (dataPoints.length > 0) {
            dataPoints.forEach(function(p, i) {
                mappings.push({
                    source_device: deviceId,
                    source_name: p.name,
                    iec61850_path: 'WG/' + mmxuName + '.TotW' + i + '.mag.f',
                    target_type: 'float32',
                    scale: 1,
                    offset: 0
                });
            });
        } else {
            var devicePoints = allDataPoints.filter(function(p) { return p.device_id === deviceId; });
            devicePoints.sort(function(a, b) { return a.point_name.localeCompare(b.point_name); });
            devicePoints.forEach(function(p, i) {
                mappings.push({
                    source_device: p.device_id,
                    source_name: p.point_name,
                    iec61850_path: 'WG/' + mmxuName + '.TotW' + i + '.mag.f',
                    target_type: 'float32',
                    scale: 1,
                    offset: 0
                });
            });
        }

        deviceIndex++;
    }

    try {
        await api('PUT', '/iec61850/mappings', []);
        for (var i = 0; i < mappings.length; i++) {
            await api('POST', '/iec61850/mappings', mappings[i]);
        }
        showToast('IEC 61850 一键配置完成，共 ' + mappings.length + ' 个映射');
        await loadIEC61850Data();
    } catch (error) {
        showToast('IEC 61850 配置失败', 'danger');
    }
}

// 生成默认的数据对象（用于自动创建逻辑节点）
function generateDefaultDataObjects(count) {
    var num = count || 20; // 默认生成20个数据对象
    var dataObjects = [];
    for (var i = 0; i < num; i++) {
        dataObjects.push({
            name: 'TotW' + i,
            data_attributes: [
                { name: 'q', type: 'QUALITY', fc: 'MX', triggers: 'QUALITY_CHANGED' },
                { name: 't', type: 'TIMESTAMP', fc: 'MX', triggers: 'DATA_CHANGED' },
                {
                    name: 'mag',
                    children: [
                        { name: 'f', type: 'FLOAT32', fc: 'MX', triggers: 'DATA_CHANGED' }
                    ]
                }
            ]
        });
    }
    return dataObjects;
}

    tcpOutputs.forEach(function(o) { allIds.push(o.id); });
    rtuOutputs.forEach(function(o) { allIds.push(o.id); });

    var maxNum = 0;
    allIds.forEach(function(id) {
        var match = id.match(/^(tcp|rtu|output)_(\d+)$/);
        if (match) {
            var num = parseInt(match[2]);
            if (num > maxNum) maxNum = num;
        }
    });

    return 'output_' + (maxNum + 1);
}

async function editOutput(outputId) {
    var output = null;
    tcpOutputs.forEach(function(o) { if (o.id === outputId) output = o; });
    rtuOutputs.forEach(function(o) { if (o.id === outputId) output = o; });
    if (!output) return;

    var type = tcpOutputs.indexOf(output) >= 0 ? 'tcp' : 'rtu';
    document.getElementById('outputModalTitle').textContent = '编辑输出';
    document.getElementById('outputId').value = output.id;
    document.getElementById('outputId').disabled = true;
    document.getElementById('outputIdGroup').style.display = 'block';
    document.getElementById('outputName').value = output.name;
    document.getElementById('outputProtocol').value = type;
    document.getElementById('outputProtocol').disabled = true;
    document.getElementById('outputSlaveId').value = output.slave_id;

    if (type === 'tcp') {
        document.getElementById('tcpPort').value = output.listen_port || 502;
        document.getElementById('maxConnections').value = output.max_connections || 10;
    } else {
        await loadSerialPortsForOutput();
        document.getElementById('rtuPort').value = output.port || '';
        document.getElementById('rtuBaudRate').value = output.baud_rate || 9600;
    }

    toggleOutputFields();
    new bootstrap.Modal(document.getElementById('outputModal')).show();
}

async function deleteOutput(outputId) {
    if (!await confirmAction('确定删除该输出配置？')) return;
    tcpOutputs = tcpOutputs.filter(function(o) { return o.id !== outputId; });
    rtuOutputs = rtuOutputs.filter(function(o) { return o.id !== outputId; });
    selectedOutputId = '';
    await saveOutputsToServer();
}

async function saveOutput() {
    var type = document.getElementById('outputProtocol').value;
    var output = {
        id: document.getElementById('outputId').value || generateOutputId(),
        name: document.getElementById('outputName').value,
        slave_id: parseInt(document.getElementById('outputSlaveId').value)
    };

    if (!output.name) { showToast('请填写名称', 'warning'); return; }

    if (type === 'tcp') {
        output.listen_port = parseInt(document.getElementById('tcpPort').value);
        output.max_connections = parseInt(document.getElementById('maxConnections').value);
        if (!document.getElementById('outputId').disabled) {
            if (tcpOutputs.some(function(o) { return o.id === output.id; }) || rtuOutputs.some(function(o) { return o.id === output.id; })) {
                showToast('输出ID已存在', 'warning'); return;
            }
            tcpOutputs.push(output);
        } else {
            tcpOutputs = tcpOutputs.map(function(o) { return o.id === output.id ? output : o; });
        }
    } else {
        output.port = document.getElementById('rtuPort').value;
        output.baud_rate = parseInt(document.getElementById('rtuBaudRate').value);
        if (!output.port) { showToast('请选择串口', 'warning'); return; }
        if (!document.getElementById('outputId').disabled) {
            if (tcpOutputs.some(function(o) { return o.id === output.id; }) || rtuOutputs.some(function(o) { return o.id === output.id; })) {
                showToast('输出ID已存在', 'warning'); return;
            }
            rtuOutputs.push(output);
        } else {
            rtuOutputs = rtuOutputs.map(function(o) { return o.id === output.id ? output : o; });
        }
    }

    await saveOutputsToServer();
}

async function saveOutputsToServer() {
    try {
        var result = await api('PUT', '/outputs', { modbus_tcp_servers: tcpOutputs, modbus_rtu_servers: rtuOutputs });
        if (result && result.code === 0) {
            showToast('保存成功');
            bootstrap.Modal.getInstance(document.getElementById('outputModal'))?.hide();
            await loadOutputs();
            renderModbusOutputs();
        } else {
            showToast(result.message || '保存失败', 'danger');
        }
    } catch (error) {
        showToast('网络错误', 'danger');
    }
}

function toggleOutputFields() {
    var type = document.getElementById('outputProtocol').value;
    document.getElementById('tcpFields').style.display = type === 'tcp' ? 'block' : 'none';
    document.getElementById('rtuFields').style.display = type === 'rtu' ? 'block' : 'none';
    document.getElementById('maxConnectionsField').style.display = type === 'tcp' ? 'block' : 'none';
}

async function loadSerialPortsForOutput() {
    try {
        var result = await api('GET', '/system/serial-ports');
        if (result && result.code === 0) {
            var select = document.getElementById('rtuPort');
            select.innerHTML = '';
            (result.data || []).forEach(function(port) {
                var opt = document.createElement('option');
                opt.value = port.name;
                opt.textContent = port.name + (port.used ? ' (' + port.used_by + ' 已占用)' : '');
                if (port.used) opt.disabled = true;
                select.appendChild(opt);
            });
        }
    } catch (e) {}
}
</script>
