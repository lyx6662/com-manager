<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">设备管理</h4>
    <button class="btn btn-primary" onclick="showAddDevice()">
        <i class="bi bi-plus-lg"></i> 新增设备
    </button>
</div>

<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>设备ID</th>
                        <th>设备名称</th>
                        <th>类型</th>
                        <th>协议</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="deviceTableBody">
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- 新增/编辑设备弹窗 -->
<div class="modal fade" id="deviceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="deviceModalTitle">新增设备</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="deviceForm">
                    <div class="mb-3">
                        <label class="form-label">设备ID</label>
                        <input type="text" class="form-control" id="deviceId" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">设备名称</label>
                        <input type="text" class="form-control" id="deviceName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">设备类型</label>
                        <select class="form-select" id="deviceType" onchange="toggleConnectionFields()">
                            <option value="serial">串口设备</option>
                            <option value="network">网口设备</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">协议</label>
                        <select class="form-select" id="deviceProtocol">
                            <option value="modbus_rtu">Modbus RTU</option>
                            <option value="modbus_tcp">Modbus TCP</option>
                            <option value="iec61850">IEC 61850</option>
                        </select>
                    </div>
                    <div id="serialFields">
                        <div class="mb-3">
                            <label class="form-label">串口号</label>
                            <select class="form-select" id="serialPort">
                                <option value="">加载中...</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-4 mb-3">
                                <label class="form-label">波特率</label>
                                <select class="form-select" id="baudRate">
                                    <option value="9600">9600</option>
                                    <option value="19200">19200</option>
                                    <option value="38400">38400</option>
                                    <option value="115200">115200</option>
                                </select>
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label">从站地址</label>
                                <input type="number" class="form-control" id="slaveId" value="1" min="1" max="247">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label">数据位</label>
                                <select class="form-select" id="dataBits">
                                    <option value="7">7</option>
                                    <option value="8" selected>8</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">停止位</label>
                                <select class="form-select" id="stopBits">
                                    <option value="1" selected>1</option>
                                    <option value="2">2</option>
                                </select>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">校验位</label>
                                <select class="form-select" id="parity">
                                    <option value="none" selected>无 (None)</option>
                                    <option value="even">偶校验 (Even)</option>
                                    <option value="odd">奇校验 (Odd)</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div id="networkFields" style="display:none;">
                        <div class="row">
                            <div class="col-8 mb-3">
                                <label class="form-label">IP地址</label>
                                <input type="text" class="form-control" id="host" placeholder="192.168.1.100">
                            </div>
                            <div class="col-4 mb-3">
                                <label class="form-label">端口</label>
                                <input type="number" class="form-control" id="netPort" value="502">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">从站地址 (Slave ID)</label>
                            <input type="number" class="form-control" id="netSlaveId" value="1" min="0" max="247">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="form-label">轮询间隔</label>
                            <input type="text" class="form-control" id="pollInterval" value="5s">
                        </div>
                        <div class="col-6 mb-3">
                            <label class="form-label">超时时间</label>
                            <input type="text" class="form-control" id="timeout" value="3s">
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="deviceEnabled" checked>
                        <label class="form-check-label">启用</label>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="saveDevice()">保存</button>
            </div>
        </div>
    </div>
</div>

<script>
var devices = [];
var serialPorts = [];

// 生成设备ID
function generateDeviceId(type) {
    const prefix = type === 'serial' ? 'serial' : 'network';
    const existingIds = devices.map(d => d.id);
    let counter = 1;
    while (existingIds.includes(`${prefix}-${counter}`)) {
        counter++;
    }
    return `${prefix}-${counter}`;
}

async function initDevicePage() {
    await loadDevices();
}

// 加载串口列表
async function loadSerialPorts() {
    try {
        const result = await api('GET', '/system/serial-ports');
        if (result && result.code === 0) {
            serialPorts = result.data || [];
        }
    } catch (error) {
        console.error('加载串口列表失败:', error);
        serialPorts = [];
    }
}

// 填充串口下拉框
function populateSerialPortSelect(currentPort) {
    const select = document.getElementById('serialPort');
    select.innerHTML = '';

    if (serialPorts.length === 0) {
        select.innerHTML = '<option value="">未检测到串口</option>';
        return;
    }

    serialPorts.forEach(port => {
        const option = document.createElement('option');
        option.value = port.name;
        option.textContent = port.name;
        if (port.used) {
            option.textContent += ` (${port.used_by} 已占用)`;
            option.disabled = true;
            option.style.color = '#999';
        }
        if (port.name === currentPort) {
            option.selected = true;
            option.disabled = false; // 当前使用的端口可以选择
        }
        select.appendChild(option);
    });
}

async function loadDevices() {
    try {
        const result = await api('GET', '/devices');
        if (result && result.code === 0) {
            devices = result.data || [];
            renderDeviceTable();
        }
    } catch (error) {
        showToast('加载设备列表失败', 'danger');
    }
}

function renderDeviceTable() {
    const tbody = document.getElementById('deviceTableBody');
    if (devices.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">暂无设备</td></tr>';
        return;
    }

    tbody.innerHTML = devices.map(device => `
        <tr>
            <td><code>${device.id}</code></td>
            <td>${device.name}</td>
            <td><span class="badge bg-${device.type === 'serial' ? 'info' : 'primary'}">${device.type === 'serial' ? '串口' : '网口'}</span></td>
            <td>${device.protocol}</td>
            <td>${formatStatus(device.online)}</td>
            <td>
                <button class="btn btn-sm btn-outline-primary btn-action" onclick="editDevice('${device.id}')">
                    <i class="bi bi-pencil"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger btn-action" onclick="deleteDevice('${device.id}')">
                    <i class="bi bi-trash"></i>
                </button>
            </td>
        </tr>
    `).join('');
}

async function showAddDevice() {
    document.getElementById('deviceModalTitle').textContent = '新增设备';
    document.getElementById('deviceForm').reset();

    // 自动生成设备ID
    const type = document.getElementById('deviceType').value;
    document.getElementById('deviceId').value = generateDeviceId(type);
    document.getElementById('deviceId').disabled = true;

    // 设置默认值
    document.getElementById('pollInterval').value = '5s';
    document.getElementById('timeout').value = '3s';
    document.getElementById('deviceEnabled').checked = true;

    // 加载串口列表
    await loadSerialPorts();
    populateSerialPortSelect('');

    toggleConnectionFields();
    new bootstrap.Modal(document.getElementById('deviceModal')).show();
}

async function editDevice(id) {
    const device = devices.find(d => d.id === id);
    if (!device) return;

    document.getElementById('deviceModalTitle').textContent = '编辑设备';
    document.getElementById('deviceId').value = device.id;
    document.getElementById('deviceId').disabled = true;
    document.getElementById('deviceName').value = device.name;
    document.getElementById('deviceType').value = device.type;

    // 填充协议字段
    const protocolSelect = document.getElementById('deviceProtocol');
    protocolSelect.value = device.protocol || 'modbus_rtu';

    document.getElementById('deviceEnabled').checked = device.enabled;
    document.getElementById('pollInterval').value = device.poll_interval || '5s';
    document.getElementById('timeout').value = device.timeout || '3s';

    // 加载串口列表并填充串口设备字段
    if (device.type === 'serial') {
        await loadSerialPorts();
        populateSerialPortSelect(device.port || '');
        document.getElementById('baudRate').value = device.baud_rate || 9600;
        document.getElementById('slaveId').value = device.slave_id || 1;
        document.getElementById('dataBits').value = device.data_bits || 8;
        document.getElementById('stopBits').value = device.stop_bits || 1;
        document.getElementById('parity').value = device.parity || 'none';
    }

    // 填充网口设备字段
    if (device.type === 'network') {
        document.getElementById('host').value = device.host || '';
        document.getElementById('netPort').value = device.port || 502;
        document.getElementById('netSlaveId').value = device.slave_id != null ? device.slave_id : 1;
    }

    toggleConnectionFields();
    new bootstrap.Modal(document.getElementById('deviceModal')).show();
}

function toggleConnectionFields() {
    const type = document.getElementById('deviceType').value;
    document.getElementById('serialFields').style.display = type === 'serial' ? 'block' : 'none';
    document.getElementById('networkFields').style.display = type === 'network' ? 'block' : 'none';

    // 新增模式下，切换类型时自动更新ID
    if (!document.getElementById('deviceId').disabled || document.getElementById('deviceModalTitle').textContent === '新增设备') {
        document.getElementById('deviceId').value = generateDeviceId(type);
    }
}

async function saveDevice() {
    const data = {
        id: document.getElementById('deviceId').value,
        name: document.getElementById('deviceName').value,
        type: document.getElementById('deviceType').value,
        protocol: document.getElementById('deviceProtocol').value,
        enabled: document.getElementById('deviceEnabled').checked,
        poll_interval: document.getElementById('pollInterval').value,
        timeout: document.getElementById('timeout').value,
    };

    if (data.type === 'serial') {
        data.port = document.getElementById('serialPort').value;
        data.baud_rate = parseInt(document.getElementById('baudRate').value);
        data.slave_id = parseInt(document.getElementById('slaveId').value);
        data.data_bits = parseInt(document.getElementById('dataBits').value);
        data.stop_bits = parseInt(document.getElementById('stopBits').value);
        data.parity = document.getElementById('parity').value;
    } else {
        data.host = document.getElementById('host').value;
        data.net_port = parseInt(document.getElementById('netPort').value);
        data.slave_id = parseInt(document.getElementById('netSlaveId').value);
    }

    try {
        const isEdit = document.getElementById('deviceId').disabled;
        const url = isEdit ? `/devices/${data.id}` : '/devices';
        const result = await api(isEdit ? 'PUT' : 'POST', url, data);
        if (result && result.code === 0) {
            showToast(isEdit ? '更新成功' : '创建成功');
            bootstrap.Modal.getInstance(document.getElementById('deviceModal')).hide();
            await loadDevices();
        } else {
            showToast(result.message || '操作失败', 'danger');
        }
    } catch (error) {
        showToast('网络错误', 'danger');
    }
}

async function deleteDevice(id) {
    if (!await confirmAction(`确定删除设备 ${id}？`)) return;

    try {
        const result = await api('DELETE', `/devices/${id}`);
        if (result && result.code === 0) {
            showToast('删除成功');
            await loadDevices();
        } else {
            showToast(result.message || '删除失败', 'danger');
        }
    } catch (error) {
        showToast('网络错误', 'danger');
    }
}
</script>
