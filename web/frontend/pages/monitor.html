<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">实时监控</h4>
    <div>
        <span class="badge bg-success me-2" id="onlineCount">在线: 0</span>
        <span class="badge bg-danger" id="offlineCount">离线: 0</span>
    </div>
</div>

<div class="row mb-4">
    <div class="col-md-2">
        <div class="card text-center">
            <div class="card-body py-3">
                <h5 class="card-title text-primary" id="totalDevices">0</h5>
                <p class="card-text text-muted small">设备总数</p>
            </div>
        </div>
    </div>
    <div class="col-md-2">
        <div class="card text-center">
            <div class="card-body py-3">
                <h5 class="card-title text-success" id="onlineDevices">0</h5>
                <p class="card-text text-muted small">在线设备</p>
            </div>
        </div>
    </div>
    <div class="col-md-2">
        <div class="card text-center">
            <div class="card-body py-3">
                <h5 class="card-title text-danger" id="offlineDevices">0</h5>
                <p class="card-text text-muted small">离线设备</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body py-3">
                <h5 class="card-title text-info" id="poolPoints">0</h5>
                <p class="card-text text-muted small">数据池数据点</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-center">
            <div class="card-body py-3">
                <h5 class="card-title text-warning" id="alarmCount">0</h5>
                <p class="card-text text-muted small">未确认报警</p>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header">
        <i class="bi bi-activity me-2"></i>设备状态
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>设备ID</th>
                        <th>设备名称</th>
                        <th>状态</th>
                        <th>最后轮询</th>
                        <th>错误次数</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="monitorTableBody">
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">加载中...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
async function initMonitorPage() {
    await loadDeviceStatus();
    // 每5秒刷新一次，记录到全局定时器列表
    var intervalId = setInterval(loadDeviceStatus, 5000);
    if (typeof pageIntervals !== 'undefined') {
        pageIntervals.push(intervalId);
    }
}

async function loadDeviceStatus() {
    try {
        var result = await api('GET', '/monitor/devices');
        if (result && result.code === 0) {
            var data = result.data;
            var el;
            el = document.getElementById('totalDevices');
            if (el) el.textContent = data.total || 0;
            el = document.getElementById('onlineDevices');
            if (el) el.textContent = data.online || 0;
            el = document.getElementById('offlineDevices');
            if (el) el.textContent = data.offline || 0;
            el = document.getElementById('onlineCount');
            if (el) el.textContent = '在线: ' + (data.online || 0);
            el = document.getElementById('offlineCount');
            if (el) el.textContent = '离线: ' + (data.offline || 0);
        }

        // 获取数据池统计
        try {
            var poolResult = await api('GET', '/datapool/stats');
            if (poolResult && poolResult.code === 0) {
                var poolEl = document.getElementById('poolPoints');
                if (poolEl) poolEl.textContent = poolResult.data.total_points || 0;
            }
        } catch (e) {}

        // 获取未确认报警数量
        try {
            var alarmResult = await api('GET', '/alarm/stats');
            if (alarmResult && alarmResult.code === 0) {
                var alarmEl = document.getElementById('alarmCount');
                if (alarmEl) alarmEl.textContent = alarmResult.data.unacked || 0;
            }
        } catch (e) {}

        var deviceResult = await api('GET', '/devices');
        if (deviceResult && deviceResult.code === 0) {
            renderMonitorTable(deviceResult.data || []);
        }
    } catch (error) {
        console.error('加载设备状态失败', error);
    }
}

function renderMonitorTable(devices) {
    var tbody = document.getElementById('monitorTableBody');
    if (devices.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">暂无设备</td></tr>';
        return;
    }

    tbody.innerHTML = devices.map(function(device) {
        return '<tr>' +
            '<td><code>' + device.id + '</code></td>' +
            '<td>' + device.name + '</td>' +
            '<td>' + formatStatus(device.online) + '</td>' +
            '<td>' + formatTime(device.last_poll) + '</td>' +
            '<td>' + (device.error_count || 0) + '</td>' +
            '<td><button class="btn btn-sm btn-outline-primary btn-action" onclick="viewDeviceData(\'' + device.id + '\')"><i class="bi bi-eye"></i> 详情</button></td>' +
            '</tr>';
    }).join('');
}

async function viewDeviceData(id) {
    try {
        // 使用 DataPool API 获取设备数据
        var result = await api('GET', '/datapool/device/' + id);
        if (result && result.code === 0) {
            showDeviceDataModal(id, result.data);
        } else {
            showToast('获取设备数据失败', 'danger');
        }
    } catch (error) {
        showToast('网络错误', 'danger');
    }
}

function showDeviceDataModal(deviceId, data) {
    // 移除已存在的模态框
    var existingModal = document.getElementById('deviceDataModal');
    if (existingModal) existingModal.remove();

    var points = data.points || [];

    var pointsHtml = '';
    if (points.length > 0) {
        pointsHtml = '<table class="table table-sm"><thead><tr><th>数据点</th><th>值</th><th>数据类型</th><th>质量</th><th>更新次数</th><th>时间</th></tr></thead><tbody>';
        points.forEach(function(point) {
            var qualityMap = {
                0: { text: '良好', cls: 'bg-success' },
                1: { text: '坏', cls: 'bg-danger' },
                2: { text: '不确定', cls: 'bg-warning' },
                3: { text: '超时', cls: 'bg-warning' },
                4: { text: '断开', cls: 'bg-secondary' }
            };
            var q = qualityMap[point.quality] || { text: '未知', cls: 'bg-secondary' };
            pointsHtml += '<tr>' +
                '<td>' + point.point_name + '</td>' +
                '<td><strong>' + (point.value !== null && point.value !== undefined ? point.value : '-') + '</strong></td>' +
                '<td><span class="badge bg-secondary">' + (point.data_type || '') + '</span></td>' +
                '<td><span class="badge ' + q.cls + '">' + q.text + '</span></td>' +
                '<td>' + (point.update_count || 0) + '</td>' +
                '<td>' + formatTime(point.timestamp) + '</td>' +
                '</tr>';
        });
        pointsHtml += '</tbody></table>';
    } else {
        pointsHtml = '<p class="text-muted text-center py-3">暂无实时数据</p>';
    }

    var modalHtml = '<div class="modal fade" id="deviceDataModal" tabindex="-1">' +
        '<div class="modal-dialog modal-lg">' +
        '<div class="modal-content">' +
        '<div class="modal-header">' +
        '<h5 class="modal-title">设备详情: ' + deviceId + ' (' + points.length + ' 个数据点)</h5>' +
        '<button type="button" class="btn-close" data-bs-dismiss="modal"></button>' +
        '</div>' +
        '<div class="modal-body">' + pointsHtml + '</div>' +
        '<div class="modal-footer">' +
        '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>' +
        '</div></div></div></div>';

    document.body.insertAdjacentHTML('beforeend', modalHtml);
    new bootstrap.Modal(document.getElementById('deviceDataModal')).show();
}
</script>
